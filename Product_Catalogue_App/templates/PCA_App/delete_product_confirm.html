{% extends 'PCA_App/base.html' %}
{% load static %}

{% block title %}Delete Product - Product Catalog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm border-danger">
            <div class="card-body p-5 text-center">
                <div class="mb-3">
                    <i class="bi bi-exclamation-triangle-fill text-danger display-4"></i>
                </div>
                <h2 class="fw-bold mb-2">Delete Product?</h2>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>«&nbsp;{{ product.name }}&nbsp;»</strong>? This cannot be undone.</p>
                <form method="post" action="{% url 'Products_app:delete_product_confirm' product.id %}">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                        <a href="{% url 'Products_app:manage_products' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
